<style>
html,body{background:#f9f8f6}
#pf-gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
  padding:24px;background:#f9f8f6;color:#1a1814;opacity:0;transition:opacity .45s ease}
#pf-gate.on{opacity:1}
#pf-gate .box{width:100%;max-width:420px}
#pf-gate .mark{font-family:'Syne',sans-serif;font-weight:800;font-size:13px;letter-spacing:.18em;
  text-transform:uppercase;padding-bottom:16px;border-bottom:1px solid #e8e5e0}
#pf-gate h1{font-family:'Syne',sans-serif;font-weight:700;font-size:clamp(28px,5vw,40px);
  line-height:1.1;letter-spacing:-.02em;margin:28px 0 10px}
#pf-gate p{font-family:'DM Sans','Noto Sans TC',sans-serif;font-weight:300;font-size:14px;
  line-height:1.7;color:#8a857c;margin:0 0 28px}
#pf-form{display:flex;gap:8px;align-items:stretch}
#pf-pw{flex:1;min-width:0;font-family:'DM Mono','DM Sans',monospace;font-size:15px;letter-spacing:.06em;
  padding:14px 16px;color:#1a1814;background:transparent;border:1px solid #c8c4bc;border-radius:0;
  outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none}
#pf-pw:focus{border-color:#1a1814;box-shadow:inset 0 0 0 1px #1a1814}
#pf-pw::placeholder{color:#b3aea4;letter-spacing:.02em}
#pf-go{font-family:'Syne',sans-serif;font-weight:600;font-size:13px;letter-spacing:.06em;
  padding:14px 22px;color:#f9f8f6;background:#1a1814;border:1px solid #1a1814;border-radius:0;
  cursor:pointer;transition:opacity .2s;white-space:nowrap}
#pf-go:hover{opacity:.82}
#pf-go[disabled]{opacity:.45;cursor:default}
#pf-msg{font-family:'DM Sans','Noto Sans TC',sans-serif;font-size:13px;line-height:1.6;
  margin-top:14px;min-height:20px;color:#8a857c;opacity:0;transition:opacity .2s}
#pf-msg.on{opacity:1}
#pf-msg.bad{color:#a3392c}
#pf-gate .foot{margin-top:44px;padding-top:16px;border-top:1px solid #e8e5e0;
  font-family:'DM Sans','Noto Sans TC',sans-serif;font-size:12px;color:#b3aea4;
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
#pf-gate .foot a{color:inherit;text-decoration:none;border-bottom:1px solid #e8e5e0}
#pf-gate .foot a:hover{color:#1a1814}
</style>
</head>
<body>

<div id="pf-gate" hidden>
  <div class="box">
    <div class="mark">Eason Lee</div>
    <h1>Private Portfolio</h1>
    <p>這份作品集需要密碼才能瀏覽。<br>This portfolio is password protected.</p>
    <form id="pf-form" autocomplete="off">
      <input id="pf-pw" type="password" placeholder="密碼 / Password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
      <button id="pf-go" type="submit">Enter</button>
    </form>
    <div id="pf-msg"></div>
    <div class="foot">

    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var P = JSON.parse(document.getElementById('pf-payload').textContent);
  var SKEY = 'pf-unlock-key';
  var gate = document.getElementById('pf-gate');
  var form = document.getElementById('pf-form');
  var pw = document.getElementById('pf-pw');
  var go = document.getElementById('pf-go');
  var msg = document.getElementById('pf-msg');

  function bin(b64) {
    var s = atob(b64), a = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
    return a;
  }
  function b64(u8) {
    var s = '', C = 0x8000;
    for (var i = 0; i < u8.length; i += C) s += String.fromCharCode.apply(null, u8.subarray(i, i + C));
    return btoa(s);
  }
  function say(text, bad) {
    msg.textContent = text;
    msg.className = 'on' + (bad ? ' bad' : '');
  }
  function show(text, bad) {
    gate.hidden = false;
    requestAnimationFrame(function () { gate.classList.add('on'); });
    if (text) say(text, bad);
    setTimeout(function () { pw.focus(); }, 60);
  }

  if (!window.crypto || !window.crypto.subtle) {
    show('這個瀏覽器（或 http:// 連線）不支援解密，請改用 https:// 開啟。', true);
    return;
  }

  function derive(pass) {
    return crypto.subtle
      .importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits'])
      .then(function (k) {
        return crypto.subtle.deriveBits(
          { name: 'PBKDF2', salt: bin(P.s), iterations: P.i, hash: 'SHA-256' }, k, 512);
      })
      .then(function (bits) { return new Uint8Array(bits); });
  }

  function unlock(master) {
    var iv = bin(P.v), ct = bin(P.c), mac = bin(P.m);
    var signed = new Uint8Array(iv.length + ct.length);
    signed.set(iv, 0); signed.set(ct, iv.length);
    return crypto.subtle
      .importKey('raw', master.subarray(32, 64), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify'])
      .then(function (hk) { return crypto.subtle.verify('HMAC', hk, mac, signed); })
      .then(function (ok) {
        if (!ok) throw new Error('auth');
        return crypto.subtle.importKey('raw', master.subarray(0, 32), { name: 'AES-CBC' }, false, ['decrypt']);
      })
      .then(function (ak) { return crypto.subtle.decrypt({ name: 'AES-CBC', iv: iv }, ak, ct); })
      .then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); });
  }

  function render(doc) {
    var root = document.documentElement;
    document.title = doc.t;
    root.setAttribute('lang', doc.l);
    root.setAttribute('data-lang', doc.d);
    document.body.innerHTML = doc.h;
    var s = document.createElement('script');
    s.src = P.b + 'assets/js/main.js';
    s.onload = function () {
      if (!location.hash) return;
      var t = null;
      try { t = document.querySelector(location.hash); } catch (e) {}
      if (t) t.scrollIntoView();
    };
    document.body.appendChild(s);
  }

  var saved = null;
  try { saved = sessionStorage.getItem(SKEY); } catch (e) {}

  if (saved) {
    unlock(bin(saved)).then(render).catch(function () {
      try { sessionStorage.removeItem(SKEY); } catch (e) {}
      show();
    });
  } else {
    show();
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (go.disabled) return;
    go.disabled = true;
    say('解密中… / Unlocking…', false);
    derive(pw.value)
      .then(function (master) {
        return unlock(master).then(function (doc) {
          try { sessionStorage.setItem(SKEY, b64(master)); } catch (e) {}
          render(doc);
        });
      })
      .catch(function () {
        go.disabled = false;
        say('密碼不正確 / Incorrect password', true);
        pw.select();
      });
  });
})();
</script>
